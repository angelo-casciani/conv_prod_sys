# ============================================================
# LOCAL/DEVELOPMENT DOCKER COMPOSE
# ============================================================
# For server deployment, use: server/docker-compose.server.yml
# ============================================================

version: "3.3"

services:
  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lego-chatbot
    ports:
      - "7860:7860"
    volumes:
      - ./data:/app/data:ro
      - ./log:/app/log
      - ./runtime_logs:/app/runtime_logs
      - ./pmmOutputs:/app/pmmOutputs
      - ./src/extractor_outputs:/app/src/extractor_outputs
      # Mount Docker socket to allow controlling sibling containers (for UPPAAL)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - .env
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - APP_LOG_DIR=/app/runtime_logs
      - INTERACTION_LOG_DIR=/app/runtime_logs/interactions
    networks:
      - chatbot_network
    restart: unless-stopped

  # Build the Uppaal engine from the local Dockerfile
  uppaal:
    build:
      context: .                     # project root (contains src/uppaal/)
      dockerfile: Dockerfile.uppaal
    container_name: uppaal-engine
    ports:
      - "2350:2350"
    volumes:
      - ./data/automaton:/home/uppaal/models:ro
    restart: unless-stopped
    environment:
      - USER=uppaal
      - UPPAAL_LICENSE_KEY=${UPPAAL_LICENSE_KEY}
      - UPPAAL_LEASE=1
    networks:
      - chatbot_network

  extractor:
    build:
      context: ./src/DTLogExtSim/Extractor
    container_name: extractor-service
    volumes:   
      - uploads:/app/uploads
      - download:/app/download
      - ./src/extractor_outputs:/app/extractor
    ports:
      - "6662:6662"
    networks:
      - chatbot_network
    restart: unless-stopped

volumes:
  uploads:
  download:

networks:
  chatbot_network:
    driver: bridge
